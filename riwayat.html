<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Riwayat password · Kalis Testbed</title>
  <link rel="stylesheet" href="assets/gaya.css">
  <script src="assets/skenario.js"></script>
  <script src="assets/uji.js"></script>
</head>
<body>
<main>
  <div class="judul-hal">
    <h1>Ganti password Akun E</h1>
    <p>Halaman khusus uji riwayat penggantian password. Akun E punya status sendiri supaya skenario lain tidak terganggu.</p>
  </div>
  <div class="dua-kolom">
    <div>
      <div class="kotak">
        <form id="form" class="form-uji" novalidate>
          <label class="kol" for="username">Akun</label>
          <input id="username" name="username" type="email" autocomplete="username" value="riwayat@kalis.test" readonly data-testid="username" data-cek="Akun (read-only)" data-harapan="manual">
          <label class="kol" for="pw-lama">Password saat ini</label>
          <input id="pw-lama" name="password_lama" type="password" autocomplete="current-password" data-testid="password-lama" data-cek="Password saat ini" data-jenis="password">
          <label class="kol" for="pw-baru">Password baru</label>
          <input id="pw-baru" name="password_baru" type="password" autocomplete="new-password" data-testid="password-baru" data-cek="Password baru" data-jenis="password" data-harapan="kosong">
          <label class="kol" for="pw-baru2">Ulangi password baru</label>
          <input id="pw-baru2" name="password_baru_konfirmasi" type="password" autocomplete="new-password" data-testid="password-baru-konfirmasi" data-cek="Ulangi password baru" data-jenis="password" data-harapan="kosong">
          <p class="galat" id="galat" role="alert"></p>
          <button type="submit" data-testid="simpan">Simpan password</button>
        </form>
        <p class="ringkas-data">Password Akun E di situs ini sekarang: <code id="pw-situs" data-testid="password-situs"></code><br>
          <a href="#" id="setel-ulang" data-testid="setel-ulang">Setel ulang Akun E</a> ke <code>Riwayat-1-2026!</code></p>
        <div class="status-wadah" data-status></div>
      </div>
    </div>
    <div data-panel="riwayat-password"></div>
  </div>
</main>
<script>
  const T = KALIS_TESTBED;
  const email = T.akun.E.email;
  const tampil = () => (document.getElementById("pw-situs").textContent = Uji.server.password(email));
  tampil();
  // Tautan, bukan <button>: content script Kalis menangkap login saat tombol diklik.
  document.getElementById("setel-ulang").addEventListener("click", (e) => {
    e.preventDefault();
    Uji.server.setel(email, T.akun.E.password);
    tampil();
  });
  document.getElementById("form").addEventListener("submit", (e) => {
    e.preventDefault();
    const lama = document.getElementById("pw-lama").value;
    const baru = document.getElementById("pw-baru").value;
    const baru2 = document.getElementById("pw-baru2").value;
    const galat = document.getElementById("galat");
    if (baru.length < 8) return (galat.textContent = "Password baru minimal 8 karakter.");
    if (baru !== baru2) return (galat.textContent = "Konfirmasi password baru tidak sama.");
    if (baru === lama) return (galat.textContent = "Password baru harus berbeda dari yang lama.");
    if (!Uji.server.ganti(email, lama, baru)) return (galat.textContent = "Password saat ini salah.");
    Uji.berhasil("ganti", email);
  });
</script>
</body>
</html>
