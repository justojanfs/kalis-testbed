<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jebakan tersembunyi · Kalis Testbed</title>
  <link rel="stylesheet" href="assets/gaya.css">
  <script src="assets/skenario.js"></script>
  <script src="assets/uji.js"></script>
</head>
<body>
<main>
  <div class="judul-hal">
    <h1>Masuk (dengan kolom jebakan)</h1>
    <p>Lima kolom jebakan diletakkan SEBELUM kolom asli, disembunyikan dengan cara CSS yang umum. Hanya kolom asli yang terlihat.</p>
  </div>
  <div class="dua-kolom">
    <div>
      <div class="kotak">
        <form id="form" class="form-uji" novalidate>
          <input name="email" type="email" autocomplete="username" style="display:none" data-cek="display:none (email)" data-harapan="kosong" data-jebakan>
          <div style="visibility:hidden;height:0">
            <input name="pass" type="password" data-cek="visibility:hidden (password)" data-harapan="kosong" data-jebakan data-jenis="password">
          </div>
          <input name="username" type="text" style="opacity:0;position:absolute;width:200px;height:30px;pointer-events:none" tabindex="-1" data-cek="opacity:0 (username)" data-harapan="kosong" data-jebakan>
          <input name="password" type="password" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;border:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap" tabindex="-1" data-cek="sr-only 1px (password)" data-harapan="kosong" data-jebakan data-jenis="password">
          <input name="login" type="text" disabled style="display:none" data-cek="disabled + display:none (login)" data-harapan="kosong" data-jebakan>
          <label class="kol" for="email">Email</label>
          <input id="email" name="user_email" type="email" autocomplete="username" data-testid="email" data-cek="Email (asli)">
          <label class="kol" for="password">Password</label>
          <input id="password" name="user_password" type="password" autocomplete="current-password" data-testid="password" data-cek="Password (asli)" data-jenis="password">
          <p class="galat" id="galat" role="alert"></p>
          <button type="submit" data-testid="masuk">Masuk</button>
        </form>
        <p class="ringkas-data">Akun A: <code>uji@kalis.test</code> / <code>Uji-Kalis-2026!</code></p>
        <div class="status-wadah" data-status></div>
      </div>
    </div>
    <div data-panel="jebakan"></div>
  </div>
</main>
<script>
  document.getElementById("form").addEventListener("submit", (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value;
    const pw = document.getElementById("password").value;
    if (Uji.server.masuk(email, pw)) Uji.berhasil("login", email);
    else document.getElementById("galat").textContent = "Email atau password salah.";
  });
</script>
</body>
</html>
