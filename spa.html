<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk (SPA) · Kalis Testbed</title>
  <link rel="stylesheet" href="assets/gaya.css">
  <script src="assets/skenario.js"></script>
  <script src="assets/uji.js"></script>
</head>
<body>
<main>
  <div class="judul-hal">
    <h1>Masuk gaya SPA</h1>
    <p>Tidak ada elemen &lt;form&gt; dan tidak ada pindah halaman. Tombol memanggil JavaScript; Enter di kolom password juga masuk.</p>
  </div>
  <div class="dua-kolom">
    <div>
      <div class="kotak">
        <div id="area-masuk" class="form-uji">
          <label class="kol" for="spa-email">Email</label>
          <input id="spa-email" type="email" autocomplete="username" placeholder="nama@contoh.com" data-testid="email" data-cek="Email">
          <label class="kol" for="spa-password">Password</label>
          <input id="spa-password" type="password" autocomplete="current-password" data-testid="password" data-cek="Password" data-jenis="password">
          <p class="galat" id="galat" role="alert"></p>
          <button type="button" id="tombol-masuk" data-testid="masuk">Masuk</button>
        </div>
        <div id="area-dalam" class="form-uji" style="display:none">
          <p style="margin:0">Sudah masuk sebagai <strong id="siapa"></strong>.</p>
          <button type="button" class="sekunder" id="tombol-keluar" data-testid="keluar">Keluar</button>
        </div>
        <p class="ringkas-data">Akun A: <code>uji@kalis.test</code> / <code>Uji-Kalis-2026!</code><br>Akun D: <code>spa@kalis.test</code> / <code>Spa-Kalis-2026!</code></p>
        <div class="status-wadah" data-status></div>
      </div>
    </div>
    <div data-panel="spa"></div>
  </div>
</main>
<script>
  const emailEl = document.getElementById("spa-email");
  const pwEl = document.getElementById("spa-password");
  function masuk() {
    if (Uji.server.masuk(emailEl.value, pwEl.value)) {
      document.getElementById("galat").textContent = "";
      document.getElementById("siapa").textContent = emailEl.value.trim();
      document.getElementById("area-masuk").style.display = "none";
      document.getElementById("area-dalam").style.display = "";
      history.pushState({}, "", "#beranda");
    } else {
      document.getElementById("galat").textContent = "Email atau password salah.";
    }
  }
  document.getElementById("tombol-masuk").addEventListener("click", masuk);
  pwEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      masuk();
    }
  });
  document.getElementById("tombol-keluar").addEventListener("click", () => {
    emailEl.value = "";
    pwEl.value = "";
    document.getElementById("area-dalam").style.display = "none";
    document.getElementById("area-masuk").style.display = "";
    history.pushState({}, "", location.pathname);
  });
</script>
</body>
</html>
